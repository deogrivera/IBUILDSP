<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Viewer · Clean Data (Row 3+)</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            max-width: 1500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,20,30,0.25);
            padding: 2rem 2rem 2.5rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b1e2b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.2rem;
            flex-wrap: wrap;
        }
        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 0.75rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 1.2rem;
        }
        .source-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            background: #f2f6fc;
            padding: 0.4rem 1rem 0.4rem 1.4rem;
            border-radius: 60px;
            border: 1px solid #d5dee7;
            flex: 1 1 300px;
        }
        .source-area i { color: #2d7aff; }
        .source-area input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
            outline: none;
            color: #0b1e2b;
            font-weight: 450;
        }
        .source-area input::placeholder { color: #8ba0b3; font-weight: 350; }
        .load-btn {
            background: #2d7aff;
            border: none;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2d7aff;
        }
        .load-btn:hover { background: #1a5fd9; border-color: #1a5fd9; box-shadow: 0 4px 10px rgba(45,122,255,0.25); }
        .load-btn:active { transform: scale(0.96); }
        .stats {
            background: #eef3f8;
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1f3a4b;
            font-weight: 500;
            white-space: nowrap;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1d3b4f;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-group input {
            padding: 0.5rem 1rem;
            border: 1.5px solid #dbe1e9;
            border-radius: 60px;
            font-size: 0.9rem;
            background: white;
            min-width: 200px;
            outline: none;
        }
        .filter-group input:focus {
            border-color: #2d7aff;
            box-shadow: 0 0 0 3px rgba(45,122,255,0.15);
        }
        .filter-group input::placeholder { color: #9aabb8; font-weight: 300; }
        .reload-btn {
            background: white;
            border: 1.5px solid #dbe1e9;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            color: #1d3b4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reload-btn:hover { background: #f2f6fc; border-color: #b0c2d4; }

        .column-controls {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0.5rem;
            background: #f8fafc;
            padding: 0.4rem 0.8rem;
            border-radius: 60px;
            border: 1px solid #e6ecf3;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            scrollbar-width: thin;
        }
        .column-controls::-webkit-scrollbar {
            height: 4px;
        }
        .column-controls::-webkit-scrollbar-track {
            background: #eef3f8;
            border-radius: 10px;
        }
        .column-controls::-webkit-scrollbar-thumb {
            background: #c5d4e2;
            border-radius: 10px;
        }
        .column-controls select {
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            border: 1.5px solid #dbe1e9;
            font-size: 0.75rem;
            background: white;
            outline: none;
            flex-shrink: 0;
            cursor: pointer;
            color: #1d3b4f;
            font-weight: 500;
        }
        .column-controls select:focus {
            border-color: #2d7aff;
        }
        .column-controls .compact-toggles {
            display: flex;
            gap: 2px;
            overflow-x: auto;
            padding: 2px 4px;
            flex: 1;
            scrollbar-width: thin;
        }
        .column-controls .compact-toggles::-webkit-scrollbar {
            height: 3px;
        }
        .column-controls .compact-toggles::-webkit-scrollbar-thumb {
            background: #c5d4e2;
            border-radius: 10px;
        }
        .column-controls .toggle-item {
            font-size: 0.65rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0.15rem 0.4rem;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.1s;
            color: #1d3b4f;
            background: transparent;
        }
        .column-controls .toggle-item:hover {
            background: #eef3f8;
        }
        .column-controls .toggle-item input[type="checkbox"] {
            accent-color: #2d7aff;
            width: 12px;
            height: 12px;
            cursor: pointer;
            margin: 0;
        }
        .column-controls .toggle-item .col-label {
            font-size: 0.6rem;
            font-weight: 450;
            letter-spacing: 0.2px;
            color: #2d4a62;
        }
        .column-controls .divider {
            width: 1px;
            height: 24px;
            background: #dde4ed;
            flex-shrink: 0;
            margin: 0 2px;
        }
        .column-controls .control-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5b7a93;
            flex-shrink: 0;
            margin-right: 2px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e6ecf3;
            background: white;
            margin-top: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 700px;
        }
        th {
            text-align: left;
            padding: 0.9rem 1rem;
            background: #f8fafc;
            color: #1d3b4f;
            font-weight: 600;
            border-bottom: 2px solid #dde4ed;
            white-space: nowrap;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #eaeef4;
            color: #1e2f3e;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f6faff; }
        .col-hidden { display: none; }

        .empty-state {
            padding: 3.5rem 1rem;
            text-align: center;
            color: #5f7485;
            background: #fafcfe;
        }
        .empty-state i {
            font-size: 2.2rem;
            color: #b6c9db;
            display: block;
            margin-bottom: 0.5rem;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 3rem 0;
            color: #2a4a62;
        }
        .loading i {
            font-size: 1.8rem;
            color: #2d7aff;
        }
        .error-box {
            background: #fff5f5;
            border: 1px solid #ffc9c9;
            border-radius: 60px;
            padding: 0.8rem 1.6rem;
            color: #b33c3c;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        .info-badge {
            background: #e8f0fe;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.75rem;
            color: #1a4a7a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 0.5rem;
        }
        @media (max-width: 700px) {
            .card { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { flex-direction: column; align-items: stretch; }
            .filter-group input { min-width: unset; width: 100%; }
            .stats { align-self: flex-start; }
            .source-area { border-radius: 30px; padding: 0.4rem 0.8rem; }
            .load-btn { width: 100%; justify-content: center; }
            .column-controls { 
                border-radius: 30px; 
                padding: 0.4rem 0.6rem;
                flex-wrap: nowrap;
            }
            .column-controls .control-label { 
                font-size: 0.6rem;
            }
            .column-controls select { 
                font-size: 0.65rem;
                padding: 0.2rem 0.5rem;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <header>
        <h1>
            <i class="fas fa-filter" style="color: #2d7aff;"></i>
            Data Viewer · Clean Data (Row 3+)
            <span class="info-badge"><i class="fas fa-check-circle"></i> Row 3+ with valid No.</span>
        </h1>
        <div class="subhead">
            <div class="source-area">
                <i class="fas fa-paste"></i>
                <input type="text" id="sourceInput" placeholder="Paste CSV or JSON URL..." 
                       value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSKiPjvkcJeCP7VuAjjFsIvMskQUlF_FegjMFxaxv6Hg-tCKLNCjPWIo1jb_G3-TgRuEXs0BK6TxOq3/pub?gid=1826747769&single=true&output=csv">
                <button class="load-btn" id="loadBtn"><i class="fas fa-arrow-right"></i> Load</button>
            </div>
            <span class="stats" id="statsDisplay"><i class="far fa-file-alt"></i> 0 records</span>
        </div>
    </header>

    <div class="source-area" style="margin-bottom: 1.2rem; border-radius: 30px;">
        <i class="fas fa-diagram-project" style="color:#12995e;"></i>
        <input type="text" id="physicalSourceInput" placeholder="Paste Physical data source CSV URL..."
               value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSKiPjvkcJeCP7VuAjjFsIvMskQUlF_FegjMFxaxv6Hg-tCKLNCjPWIo1jb_G3-TgRuEXs0BK6TxOq3/pub?gid=0&single=true&output=csv">
        <span class="info-badge" style="margin-left:0;"><i class="fas fa-layer-group"></i> Physical, Financial, Project Cost, Obligation LP/GOP, Total Obligation</span>
    </div>

    <div class="toolbar">
        <div class="filter-group">
            <label for="filterInput"><i class="fas fa-search" style="color: #5b7a93;"></i> Filter</label>
            <input type="text" id="filterInput" placeholder="Search any field...">
        </div>
        <button class="reload-btn" id="reloadBtn"><i class="fas fa-sync-alt"></i> Reload</button>
    </div>

    <!-- Compact Column Controls - Option 4 -->
    <div id="columnControls" class="column-controls" style="display: none;">
        <span class="control-label"><i class="fas fa-columns"></i> View:</span>
        <select id="columnPreset">
            <option value="all">All Columns</option>
            <option value="main">Main Only</option>
            <option value="physical">Physical</option>
            <option value="financial">Financial</option>
            <option value="projectcost">Project Cost</option>
            <option value="oblp">Obligation LP</option>
            <option value="obgop">Obligation GOP</option>
            <option value="totalob">Total Obligation</option>
            <option value="minimal">Minimal</option>
        </select>
        <div class="divider"></div>
        <div id="compactToggles" class="compact-toggles"></div>
        <div class="divider"></div>
        <button id="resetColumnsBtn" style="background: none; border: none; padding: 0.2rem 0.6rem; border-radius: 20px; cursor: pointer; font-size: 0.7rem; color: #2d7aff; font-weight: 500; flex-shrink: 0;">
            <i class="fas fa-undo-alt"></i>
        </button>
    </div>

    <div class="table-wrapper">
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner fa-pulse"></i> Loading data…
        </div>
        <table id="dataTable" style="display: none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyMessage" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i> No records found with valid data (Row 3+ with valid No.)
        </div>
    </div>

    <div id="errorMessage" class="error-box" style="display: none; margin-top: 1.2rem;">
        <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM refs
        const sourceInput = document.getElementById('sourceInput');
        const physicalSourceInput = document.getElementById('physicalSourceInput');
        const loadBtn = document.getElementById('loadBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const filterInput = document.getElementById('filterInput');
        const table = document.getElementById('dataTable');
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        const loadingEl = document.getElementById('loadingIndicator');
        const emptyEl = document.getElementById('emptyMessage');
        const errorEl = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const statsDisplay = document.getElementById('statsDisplay');
        const columnControls = document.getElementById('columnControls');
        const compactToggles = document.getElementById('compactToggles');
        const columnPreset = document.getElementById('columnPreset');
        const resetColumnsBtn = document.getElementById('resetColumnsBtn');

        // ----- COLUMN MAPPING: Col A-L + R(17), S(18) -----
        const COLUMN_MAP = [
            { index: 0, header: 'No.' },
            { index: 1, header: 'Cluster' },
            { index: 2, header: 'Region' },
            { index: 3, header: 'Province' },
            { index: 4, header: 'Municipality' },
            { index: 5, header: 'Proponent LGU' },
            { index: 6, header: 'LGU Income Class' },
            { index: 7, header: 'SP Name' },
            { index: 8, header: 'SP Type' },
            { index: 9, header: 'Target Unit' },
            { index: 10, header: 'Qty' },
            { index: 11, header: 'Linear Meter' },
            { index: 17, header: 'Status' },
            { index: 18, header: 'Remarks' }
        ];

        // ----- EXTRA COLUMN GROUPS pulled from the "Physical" data source, joined by "No." -----
        const EXTRA_COLUMNS = [
            // Physical: Col F, I
            { key: 'phys_f', index: 5, header: 'Accomp', group: 'Physical' },
            { key: 'phys_i', index: 8, header: 'Date of Completion', group: 'Physical' },
            // Financial: Col G, H
            { key: 'fin_g', index: 6, header: 'Status', group: 'Financial' },
            { key: 'fin_h', index: 7, header: 'Variance/Billable Cost', group: 'Financial' },
            // Project Cost: Col J, K, L, M
            { key: 'pc_j', index: 9, header: 'Contract', group: 'Project Cost' },
            { key: 'pc_k', index: 10, header: 'LP', group: 'Project Cost' },
            { key: 'pc_l', index: 11, header: 'GOP', group: 'Project Cost' },
            { key: 'pc_m', index: 12, header: 'Total (LP + GOP)', group: 'Project Cost' },
            // Obligation LP: Col N, O, P, Q, R, S
            { key: 'oblp_n', index: 13, header: 'Date of Obligation', group: 'Obligation LP' },
            { key: 'oblp_o', index: 14, header: 'ORS No.', group: 'Obligation LP' },
            { key: 'oblp_p', index: 15, header: 'LP-ASA', group: 'Obligation LP' },
            { key: 'oblp_q', index: 16, header: 'Date', group: 'Obligation LP' },
            { key: 'oblp_r', index: 17, header: 'LP Amount', group: 'Obligation LP' },
            { key: 'oblp_s', index: 18, header: 'Released', group: 'Obligation LP' },
            // Obligation GOP: Col U, V, W, X, Y, Z, AA
            { key: 'obgop_u', index: 20, header: 'Date of Obligation', group: 'Obligation GOP' },
            { key: 'obgop_v', index: 21, header: 'Obligation No.', group: 'Obligation GOP' },
            { key: 'obgop_w', index: 22, header: 'GOP-ASA', group: 'Obligation GOP' },
            { key: 'obgop_x', index: 23, header: 'Date', group: 'Obligation GOP' },
            { key: 'obgop_y', index: 24, header: 'Amount', group: 'Obligation GOP' },
            { key: 'obgop_z', index: 25, header: 'Released', group: 'Obligation GOP' },
            { key: 'obgop_aa', index: 26, header: 'Remaining', group: 'Obligation GOP' },
            // Total Obligation: Col AB
            { key: 'totob_ab', index: 27, header: 'Total (LP+GOP)', group: 'Total Obligation' }
        ];

        // Column groups for preset switching
        const COLUMN_GROUPS = {
            main: ['col_0', 'col_1', 'col_2', 'col_3', 'col_4', 'col_5', 'col_6', 'col_7', 'col_8', 'col_9', 'col_10', 'col_11', 'col_17', 'col_18'],
            physical: ['phys_f', 'phys_i'],
            financial: ['fin_g', 'fin_h'],
            projectcost: ['pc_j', 'pc_k', 'pc_l', 'pc_m'],
            oblp: ['oblp_n', 'oblp_o', 'oblp_p', 'oblp_q', 'oblp_r', 'oblp_s'],
            obgop: ['obgop_u', 'obgop_v', 'obgop_w', 'obgop_x', 'obgop_y', 'obgop_z', 'obgop_aa'],
            totalob: ['totob_ab'],
            minimal: ['col_0', 'col_1', 'col_2', 'col_3']
        };

        // state
        let allData = [];
        let filteredData = [];
        let currentSource = '';
        let currentPhysicalSource = '';
        let headerNames = [];
        let columnVisibility = {};
        let availableKeys = [];

        // Initialize all columns as visible
        COLUMN_MAP.forEach((c, idx) => {
            columnVisibility[`col_${idx}`] = true;
        });
        EXTRA_COLUMNS.forEach(c => {
            columnVisibility[c.key] = true;
        });

        // helpers
        function showError(msg) {
            errorText.textContent = msg || 'Could not load data.';
            errorEl.style.display = 'flex';
            loadingEl.style.display = 'none';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
            columnControls.style.display = 'none';
        }
        function hideError() { errorEl.style.display = 'none'; }
        function updateStats(count) {
            statsDisplay.innerHTML = `<i class="far fa-file-alt"></i> ${count} record${count !== 1 ? 's' : ''}`;
        }

        // ----- Quote-aware CSV parser -----
        function tokenizeCSV(csvText) {
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            let i = 0;
            const len = csvText.length;

            while (i < len) {
                const char = csvText[i];

                if (inQuotes) {
                    if (char === '"') {
                        if (csvText[i + 1] === '"') { field += '"'; i += 2; continue; }
                        inQuotes = false; i++; continue;
                    }
                    field += char; i++; continue;
                }

                if (char === '"') { inQuotes = true; i++; continue; }
                if (char === ',') { row.push(field); field = ''; i++; continue; }
                if (char === '\r') { i++; continue; }
                if (char === '\n') {
                    row.push(field); field = '';
                    rows.push(row); row = [];
                    i++; continue;
                }
                field += char; i++;
            }
            if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }

            return rows
                .filter(r => !(r.length === 1 && r[0].trim() === ''))
                .map(r => r.map(v => v.replace(/\s+/g, ' ').trim()));
        }

        function parseCSV(csvText) {
            const rawRows = tokenizeCSV(csvText);
            if (rawRows.length < 2) return { headers: [], rows: [] };

            const headers = rawRows[0];
            const cleanHeaders = headers.map((h, idx) => h ? h : `col_${idx}`);

            const rows = rawRows.slice(1).map(values => {
                const obj = {};
                cleanHeaders.forEach((h, idx) => {
                    obj[h] = (idx < values.length) ? values[idx] : '';
                });
                return obj;
            });

            return { headers: cleanHeaders, rows };
        }

        // ----- Extract data starting from row 3 (index 2) -----
        function extractFromRow3(rows) {
            if (rows.length <= 2) return [];
            return rows.slice(2);
        }

        // ----- Check if row is a valid data row -----
        function isValidDataRow(row) {
            let colAValue = '';
            if (headerNames[0] && row[headerNames[0]] !== undefined) {
                colAValue = row[headerNames[0]];
            } else {
                const values = Object.values(row);
                colAValue = values[0] || '';
            }
            
            const hasColA = colAValue !== undefined && 
                            colAValue !== null && 
                            String(colAValue).trim() !== '';
            
            if (!hasColA) return false;
            
            const numValue = String(colAValue).trim();
            const isNumeric = /^\d+$/.test(numValue);
            const isMonth = /^(january|february|march|april|may|june|july|august|september|october|november|december)/i.test(numValue);
            const isYear = /^\d{4}$/.test(numValue);
            const isTarget = /target/i.test(numValue);
            const isQuarter = /quarter/i.test(numValue);
            
            if (isMonth || isYear || isTarget || isQuarter) {
                return false;
            }
            
            if (isNumeric) {
                let hasOtherData = false;
                for (let i = 1; i < COLUMN_MAP.length; i++) {
                    const col = COLUMN_MAP[i];
                    const key = (col.index < headerNames.length) ? headerNames[col.index] : `col_${col.index}`;
                    if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
                        hasOtherData = true;
                        break;
                    }
                }
                return hasOtherData;
            }
            
            let hasOtherData = false;
            for (let i = 1; i < COLUMN_MAP.length; i++) {
                const col = COLUMN_MAP[i];
                const key = (col.index < headerNames.length) ? headerNames[col.index] : `col_${col.index}`;
                if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
                    hasOtherData = true;
                    break;
                }
            }
            return hasOtherData;
        }

        // ----- Fetch & parse the secondary data source -----
        async function loadPhysicalData(url) {
            const result = { map: {} };
            if (!url || url.trim() === '') return result;

            try {
                const response = await fetch(url.trim());
                if (!response.ok) return result;
                const text = await response.text();
                const parsed = parseCSV(text.trim());
                const physHeaderNames = parsed.headers;
                const physRows = parsed.rows;

                physRows.forEach(row => {
                    const values = Object.values(row);
                    let noVal = (physHeaderNames[0] && row[physHeaderNames[0]] !== undefined)
                        ? row[physHeaderNames[0]] : values[0];
                    noVal = noVal !== undefined && noVal !== null ? String(noVal).trim() : '';
                    if (!noVal || !/^\d+$/.test(noVal)) return;

                    const getCol = (idx) => {
                        const key = (idx < physHeaderNames.length) ? physHeaderNames[idx] : undefined;
                        const val = (key && row[key] !== undefined) ? row[key] : values[idx];
                        return (val === undefined || val === null) ? '' : val;
                    };

                    const entry = {};
                    EXTRA_COLUMNS.forEach(c => { entry[c.key] = getCol(c.index); });
                    result.map[noVal] = entry;
                });
            } catch (err) {
                console.error('Physical data load error:', err);
            }
            return result;
        }

        // ----- Get all columns -----
        function getAllColumns() {
            const cols = COLUMN_MAP.map((c, idx) => ({ key: `col_${idx}`, header: c.header, group: null }));
            EXTRA_COLUMNS.forEach(c => cols.push({ key: c.key, header: c.header, group: c.group }));
            return cols;
        }

        // ----- Build compact column toggles -----
        function buildCompactToggles() {
            compactToggles.innerHTML = '';
            const allColumns = getAllColumns();
            
            allColumns.forEach(c => {
                if (!availableKeys.includes(c.key)) return;
                
                const label = document.createElement('label');
                label.className = 'toggle-item';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = columnVisibility[c.key] !== false;
                cb.dataset.col = c.key;
                
                const span = document.createElement('span');
                span.className = 'col-label';
                // Shorten long headers
                let displayName = c.header;
                if (displayName.length > 14) {
                    displayName = displayName.slice(0, 12) + '…';
                }
                span.textContent = displayName;
                
                cb.addEventListener('change', function() {
                    columnVisibility[this.dataset.col] = this.checked;
                    updateColumnVisibility();
                    updatePresetSelection();
                });
                
                label.appendChild(cb);
                label.appendChild(span);
                compactToggles.appendChild(label);
            });
        }

        // ----- Update preset selection based on current visibility -----
        function updatePresetSelection() {
            // Check which preset matches current visibility
            const allColumns = getAllColumns().filter(c => availableKeys.includes(c.key));
            const visibleKeys = allColumns.filter(c => columnVisibility[c.key] !== false).map(c => c.key);
            
            if (visibleKeys.length === allColumns.length) {
                columnPreset.value = 'all';
                return;
            }
            
            // Check if it matches a predefined group
            for (const [groupName, groupKeys] of Object.entries(COLUMN_GROUPS)) {
                const groupKeysFiltered = groupKeys.filter(k => availableKeys.includes(k));
                const visibleInGroup = groupKeysFiltered.filter(k => columnVisibility[k] !== false);
                
                if (visibleInGroup.length === 0) continue;
                
                // Check if only these columns are visible
                const onlyTheseVisible = visibleKeys.every(k => groupKeysFiltered.includes(k));
                const allGroupVisible = groupKeysFiltered.every(k => columnVisibility[k] !== false);
                
                if (onlyTheseVisible && allGroupVisible && visibleKeys.length === groupKeysFiltered.length) {
                    columnPreset.value = groupName;
                    return;
                }
            }
            
            // Check if it's minimal (only first 4 columns)
            const minimalKeys = ['col_0', 'col_1', 'col_2', 'col_3'].filter(k => availableKeys.includes(k));
            if (visibleKeys.length === minimalKeys.length && 
                visibleKeys.every(k => minimalKeys.includes(k))) {
                columnPreset.value = 'minimal';
                return;
            }
            
            columnPreset.value = 'custom';
        }

        // ----- Apply preset -----
        function applyPreset(preset) {
            const allColumns = getAllColumns().filter(c => availableKeys.includes(c.key));
            
            if (preset === 'all') {
                allColumns.forEach(c => columnVisibility[c.key] = true);
            } else if (preset === 'minimal') {
                allColumns.forEach(c => columnVisibility[c.key] = false);
                ['col_0', 'col_1', 'col_2', 'col_3'].forEach(key => {
                    if (availableKeys.includes(key)) columnVisibility[key] = true;
                });
            } else if (COLUMN_GROUPS[preset]) {
                const groupKeys = COLUMN_GROUPS[preset].filter(k => availableKeys.includes(k));
                allColumns.forEach(c => columnVisibility[c.key] = false);
                groupKeys.forEach(key => columnVisibility[key] = true);
            }
            
            // Update checkboxes
            document.querySelectorAll('.toggle-item input[type="checkbox"]').forEach(cb => {
                cb.checked = columnVisibility[cb.dataset.col] !== false;
            });
            
            updateColumnVisibility();
            renderTable();
            setTimeout(updateColumnVisibility, 50);
        }

        // ----- Load data -----
        async function loadDataFromUrl(url) {
            if (!url || url.trim() === '') {
                showError('Please paste a valid data URL.');
                return;
            }
            const trimmedUrl = url.trim();
            currentSource = trimmedUrl;

            loadingEl.style.display = 'flex';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
            columnControls.style.display = 'none';
            hideError();
            allData = [];
            filteredData = [];
            headerNames = [];

            try {
                const response = await fetch(trimmedUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} — ${response.statusText}`);
                }
                const text = await response.text();
                const trimmedText = text.trim();

                const isCSV = trimmedText.includes(',') && 
                              (trimmedText.includes('\n') || trimmedText.includes('\r')) &&
                              !trimmedText.startsWith('{') && !trimmedText.startsWith('[');

                let rows = [];
                let headers = [];

                if (isCSV) {
                    const parsed = parseCSV(trimmedText);
                    headers = parsed.headers;
                    rows = parsed.rows;
                } else {
                    try {
                        const json = JSON.parse(trimmedText);
                        let arrayData = Array.isArray(json) ? json : 
                                        (json.data && Array.isArray(json.data) ? json.data : 
                                        (json.items && Array.isArray(json.items) ? json.items :
                                        (json.results && Array.isArray(json.results) ? json.results : [json])));
                        if (arrayData.length > 0) {
                            headers = Object.keys(arrayData[0]);
                            rows = arrayData;
                        } else {
                            rows = [];
                        }
                    } catch (e) {
                        if (trimmedText.includes(',') && trimmedText.includes('\n')) {
                            const parsed = parseCSV(trimmedText);
                            headers = parsed.headers;
                            rows = parsed.rows;
                        } else {
                            throw new Error('Data format not recognized. Please provide CSV or JSON.');
                        }
                    }
                }

                headerNames = headers;

                let dataRows = [];
                if (isCSV) {
                    dataRows = extractFromRow3(rows);
                } else {
                    dataRows = rows;
                }

                allData = dataRows
                    .filter(row => isValidDataRow(row))
                    .map(row => {
                        const newRow = {};
                        COLUMN_MAP.forEach((col, idx) => {
                            const key = `col_${idx}`;
                            if (col.index < headerNames.length && row[headerNames[col.index]] !== undefined) {
                                newRow[key] = row[headerNames[col.index]];
                            } else {
                                const values = Object.values(row);
                                newRow[key] = (col.index < values.length) ? values[col.index] : '';
                            }
                        });
                        return newRow;
                    });

                allData = allData.filter(row => Object.values(row).some(v => v !== '' && v !== undefined && v !== null));

                currentPhysicalSource = physicalSourceInput.value.trim();
                const physical = await loadPhysicalData(currentPhysicalSource);
                allData.forEach(row => {
                    const noVal = row['col_0'] !== undefined ? String(row['col_0']).trim() : '';
                    const match = physical.map[noVal];
                    EXTRA_COLUMNS.forEach(c => {
                        row[c.key] = match ? match[c.key] : '';
                    });
                });

                filterInput.value = '';
                filteredData = allData.slice();
                
                buildCompactToggles();
                setupColumnControls();
                renderTable();

            } catch (err) {
                console.error('Load error:', err);
                showError(err.message || 'Failed to fetch. Check URL or format.');
                loadingEl.style.display = 'none';
                table.style.display = 'none';
                emptyEl.style.display = 'none';
                columnControls.style.display = 'none';
            }
        }

        // ----- Setup column controls -----
        function setupColumnControls() {
            if (allData.length === 0 || availableKeys.length === 0) {
                columnControls.style.display = 'none';
                return;
            }
            
            const allColumns = getAllColumns().filter(c => availableKeys.includes(c.key));
            if (allColumns.length === 0) {
                columnControls.style.display = 'none';
                return;
            }
            
            columnControls.style.display = 'flex';
            
            // Preset change handler
            columnPreset.onchange = function() {
                if (this.value === 'custom') return;
                applyPreset(this.value);
            };
            
            // Reset button
            resetColumnsBtn.onclick = function() {
                const allColumns = getAllColumns().filter(c => availableKeys.includes(c.key));
                allColumns.forEach(c => columnVisibility[c.key] = true);
                document.querySelectorAll('.toggle-item input[type="checkbox"]').forEach(cb => {
                    cb.checked = true;
                });
                columnPreset.value = 'all';
                updateColumnVisibility();
                renderTable();
                setTimeout(updateColumnVisibility, 50);
            };
        }

        // ----- Update column visibility in table -----
        function updateColumnVisibility() {
            getAllColumns().forEach(c => {
                if (!availableKeys.includes(c.key)) return;

                const isVisible = columnVisibility[c.key] !== false;

                thead.querySelectorAll(`th[data-col="${c.key}"]`).forEach(th => {
                    th.classList.toggle('col-hidden', !isVisible);
                });
                tbody.querySelectorAll(`td[data-col="${c.key}"]`).forEach(td => {
                    td.classList.toggle('col-hidden', !isVisible);
                });

                if (c.group) {
                    const groupVisible = EXTRA_COLUMNS.filter(ec => ec.group === c.group).some(ec => columnVisibility[ec.key] !== false);
                    thead.querySelectorAll(`th[data-group="${c.group}"]`).forEach(th => {
                        th.classList.toggle('col-hidden', !groupVisible);
                    });
                }
            });
        }

        // ----- Render table -----
        function renderTable() {
            hideError();

            if (!filteredData || filteredData.length === 0) {
                table.style.display = 'none';
                emptyEl.style.display = 'block';
                loadingEl.style.display = 'none';
                columnControls.style.display = 'none';
                updateStats(0);
                return;
            }

            table.style.display = '';
            emptyEl.style.display = 'none';
            loadingEl.style.display = 'none';

            const sample = filteredData[0];
            availableKeys = Object.keys(sample);
            const allColumns = getAllColumns().filter(c => availableKeys.includes(c.key));

            const groupRow = document.createElement('tr');
            const subRow = document.createElement('tr');
            let subRowHasCells = false;
            const seenGroups = new Set();

            allColumns.forEach(c => {
                if (!c.group) {
                    const th = document.createElement('th');
                    th.textContent = c.header;
                    th.dataset.col = c.key;
                    th.rowSpan = 2;
                    if (columnVisibility[c.key] === false) th.classList.add('col-hidden');
                    groupRow.appendChild(th);
                } else {
                    if (!seenGroups.has(c.group)) {
                        seenGroups.add(c.group);
                        const groupCols = allColumns.filter(gc => gc.group === c.group);
                        const th = document.createElement('th');
                        th.textContent = c.group;
                        th.colSpan = groupCols.length;
                        th.dataset.group = c.group;
                        th.style.textAlign = 'center';
                        const groupVisible = groupCols.some(gc => columnVisibility[gc.key] !== false);
                        if (!groupVisible) th.classList.add('col-hidden');
                        groupRow.appendChild(th);
                    }
                    const subTh = document.createElement('th');
                    subTh.textContent = c.header;
                    subTh.dataset.col = c.key;
                    subTh.dataset.group = c.group;
                    if (columnVisibility[c.key] === false) subTh.classList.add('col-hidden');
                    subRow.appendChild(subTh);
                    subRowHasCells = true;
                }
            });

            thead.innerHTML = '';
            thead.appendChild(groupRow);
            if (subRowHasCells) thead.appendChild(subRow);

            tbody.innerHTML = '';
            filteredData.forEach(item => {
                const row = document.createElement('tr');
                allColumns.forEach(c => {
                    const td = document.createElement('td');
                    let val = item[c.key];
                    if (val === null || val === undefined) val = '';
                    else if (typeof val === 'object') {
                        td.textContent = JSON.stringify(val).slice(0, 50) + (JSON.stringify(val).length > 50 ? '…' : '');
                    } else {
                        td.textContent = String(val);
                    }
                    td.dataset.col = c.key;
                    if (columnVisibility[c.key] === false) {
                        td.classList.add('col-hidden');
                    }
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });

            updateStats(filteredData.length);
        }

        // ----- Filter -----
        function applyFilter() {
            const query = filterInput.value.trim().toLowerCase();
            if (!query) {
                filteredData = allData.slice();
            } else {
                filteredData = allData.filter(item => {
                    for (let key in item) {
                        const val = item[key];
                        if (val === null || val === undefined) continue;
                        if (String(val).toLowerCase().includes(query)) return true;
                    }
                    return false;
                });
            }
            renderTable();
            setTimeout(updateColumnVisibility, 50);
        }

        // ----- Event listeners -----
        loadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const url = sourceInput.value.trim();
            if (url) loadDataFromUrl(url);
            else showError('Please paste a data URL first.');
        });

        reloadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let url = currentSource || sourceInput.value.trim();
            if (!url) {
                showError('No data source. Paste a URL and load first.');
                return;
            }
            sourceInput.value = url;
            loadDataFromUrl(url);
        });

        filterInput.addEventListener('input', applyFilter);

        sourceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loadBtn.click();
            }
        });

        physicalSourceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loadBtn.click();
            }
        });

        // ----- Auto-load default -----
        const defaultUrl = sourceInput.value.trim();
        if (defaultUrl) {
            setTimeout(() => loadDataFromUrl(defaultUrl), 120);
        } else {
            loadingEl.style.display = 'none';
            emptyEl.style.display = 'block';
            updateStats(0);
        }

    })();
</script>

</body>
</html>
