<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Viewer · Hide/Show Columns</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            max-width: 1500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,20,30,0.25);
            padding: 2rem 2rem 2.5rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b1e2b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.2rem;
            flex-wrap: wrap;
        }
        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 0.75rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 1.2rem;
        }
        .source-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            background: #f2f6fc;
            padding: 0.4rem 1rem 0.4rem 1.4rem;
            border-radius: 60px;
            border: 1px solid #d5dee7;
            flex: 1 1 300px;
        }
        .source-area i { color: #2d7aff; }
        .source-area input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
            outline: none;
            color: #0b1e2b;
            font-weight: 450;
        }
        .source-area input::placeholder { color: #8ba0b3; font-weight: 350; }
        .load-btn {
            background: #2d7aff;
            border: none;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2d7aff;
        }
        .load-btn:hover { background: #1a5fd9; border-color: #1a5fd9; box-shadow: 0 4px 10px rgba(45,122,255,0.25); }
        .load-btn:active { transform: scale(0.96); }
        .stats {
            background: #eef3f8;
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1f3a4b;
            font-weight: 500;
            white-space: nowrap;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1d3b4f;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-group input {
            padding: 0.5rem 1rem;
            border: 1.5px solid #dbe1e9;
            border-radius: 60px;
            font-size: 0.9rem;
            background: white;
            min-width: 200px;
            outline: none;
        }
        .filter-group input:focus {
            border-color: #2d7aff;
            box-shadow: 0 0 0 3px rgba(45,122,255,0.15);
        }
        .filter-group input::placeholder { color: #9aabb8; font-weight: 300; }
        .reload-btn {
            background: white;
            border: 1.5px solid #dbe1e9;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            color: #1d3b4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reload-btn:hover { background: #f2f6fc; border-color: #b0c2d4; }

        /* Column visibility controls */
        .column-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 1rem;
            background: #f8fafc;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #e6ecf3;
            margin-bottom: 1.5rem;
        }
        .column-controls label {
            font-weight: 500;
            font-size: 0.8rem;
            color: #1d3b4f;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            transition: 0.1s;
        }
        .column-controls label:hover {
            background: #eef3f8;
        }
        .column-controls label input[type="checkbox"] {
            margin-right: 3px;
            accent-color: #2d7aff;
            cursor: pointer;
        }
        .column-controls .toggle-all {
            font-weight: 600;
            color: #2d7aff;
            border-right: 1px solid #dde4ed;
            padding-right: 1rem;
            margin-right: 0.5rem;
        }
        .column-controls .toggle-all label {
            font-weight: 600;
            color: #2d7aff;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e6ecf3;
            background: white;
            margin-top: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 700px;
        }
        th {
            text-align: left;
            padding: 0.9rem 1rem;
            background: #f8fafc;
            color: #1d3b4f;
            font-weight: 600;
            border-bottom: 2px solid #dde4ed;
            white-space: nowrap;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #eaeef4;
            color: #1e2f3e;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f6faff; }
        .col-hidden { display: none; }

        .empty-state {
            padding: 3.5rem 1rem;
            text-align: center;
            color: #5f7485;
            background: #fafcfe;
        }
        .empty-state i {
            font-size: 2.2rem;
            color: #b6c9db;
            display: block;
            margin-bottom: 0.5rem;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 3rem 0;
            color: #2a4a62;
        }
        .loading i {
            font-size: 1.8rem;
            color: #2d7aff;
        }
        .error-box {
            background: #fff5f5;
            border: 1px solid #ffc9c9;
            border-radius: 60px;
            padding: 0.8rem 1.6rem;
            color: #b33c3c;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        .info-badge {
            background: #e8f0fe;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.75rem;
            color: #1a4a7a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 0.5rem;
        }
        @media (max-width: 700px) {
            .card { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { flex-direction: column; align-items: stretch; }
            .filter-group input { min-width: unset; width: 100%; }
            .stats { align-self: flex-start; }
            .source-area { border-radius: 30px; padding: 0.4rem 0.8rem; }
            .load-btn { width: 100%; justify-content: center; }
            .column-controls { border-radius: 30px; padding: 0.6rem 1rem; }
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <header>
        <h1>
            <i class="fas fa-eye-slash" style="color: #2d7aff;"></i>
            Data Viewer · Hide/Show Columns
            <span class="info-badge"><i class="fas fa-check-circle"></i> Row 4+ with data</span>
        </h1>
        <div class="subhead">
            <div class="source-area">
                <i class="fas fa-paste"></i>
                <input type="text" id="sourceInput" placeholder="Paste CSV or JSON URL..." 
                       value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSKiPjvkcJeCP7VuAjjFsIvMskQUlF_FegjMFxaxv6Hg-tCKLNCjPWIo1jb_G3-TgRuEXs0BK6TxOq3/pub?gid=1826747769&single=true&output=csv">
                <button class="load-btn" id="loadBtn"><i class="fas fa-arrow-right"></i> Load</button>
            </div>
            <span class="stats" id="statsDisplay"><i class="far fa-file-alt"></i> 0 records</span>
        </div>
    </header>

    <div class="toolbar">
        <div class="filter-group">
            <label for="filterInput"><i class="fas fa-search" style="color: #5b7a93;"></i> Filter</label>
            <input type="text" id="filterInput" placeholder="Search any field...">
        </div>
        <button class="reload-btn" id="reloadBtn"><i class="fas fa-sync-alt"></i> Reload</button>
    </div>

    <!-- Column visibility controls -->
    <div id="columnControls" class="column-controls" style="display: none;">
        <span class="toggle-all">
            <label>
                <input type="checkbox" id="toggleAllColumns" checked /> Show All
            </label>
        </span>
        <span id="columnCheckboxes">
            <!-- Dynamically generated -->
        </span>
    </div>

    <div class="table-wrapper">
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner fa-pulse"></i> Loading data…
        </div>
        <table id="dataTable" style="display: none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyMessage" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i> No records found with valid data in Column A
        </div>
    </div>

    <div id="errorMessage" class="error-box" style="display: none; margin-top: 1.2rem;">
        <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM refs
        const sourceInput = document.getElementById('sourceInput');
        const loadBtn = document.getElementById('loadBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const filterInput = document.getElementById('filterInput');
        const table = document.getElementById('dataTable');
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        const loadingEl = document.getElementById('loadingIndicator');
        const emptyEl = document.getElementById('emptyMessage');
        const errorEl = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const statsDisplay = document.getElementById('statsDisplay');
        const columnControls = document.getElementById('columnControls');
        const columnCheckboxes = document.getElementById('columnCheckboxes');
        const toggleAllBtn = document.getElementById('toggleAllColumns');

        // ----- COLUMN MAPPING: Col A-L + R(17), S(18) -----
        // 0=A, 1=B, 2=C, 3=D, 4=E, 5=F, 6=G, 7=H, 8=I, 9=J, 10=K, 11=L, 17=R, 18=S
        const COLUMN_MAP = [
            { index: 0, header: 'No.' },
            { index: 1, header: 'Cluster' },
            { index: 2, header: 'Region' },
            { index: 3, header: 'Province' },
            { index: 4, header: 'Municipality' },
            { index: 5, header: 'Proponent LGU' },
            { index: 6, header: 'LGU Income Class' },
            { index: 7, header: 'SP Name' },
            { index: 8, header: 'SP Type' },
            { index: 9, header: 'Target Unit' },
            { index: 10, header: 'Qty' },
            { index: 11, header: 'Linear Meter' },
            { index: 17, header: 'Status' },
            { index: 18, header: 'Remarks' }
        ];

        const selectedIndices = COLUMN_MAP.map(c => c.index);
        const customHeaders = COLUMN_MAP.map(c => c.header);
        const columnKeys = COLUMN_MAP.map((c, idx) => `col_${idx}`);

        // state
        let allData = [];
        let filteredData = [];
        let currentSource = '';
        let headerNames = [];
        let columnVisibility = {};
        let availableKeys = [];

        // Initialize all columns as visible
        COLUMN_MAP.forEach((c, idx) => {
            columnVisibility[`col_${idx}`] = true;
        });

        // helpers
        function showError(msg) {
            errorText.textContent = msg || 'Could not load data.';
            errorEl.style.display = 'flex';
            loadingEl.style.display = 'none';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
            columnControls.style.display = 'none';
        }
        function hideError() { errorEl.style.display = 'none'; }
        function updateStats(count) {
            statsDisplay.innerHTML = `<i class="far fa-file-alt"></i> ${count} record${count !== 1 ? 's' : ''}`;
        }

        // ----- CSV parser -----
        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) return { headers: [], rows: [] };

            const rawHeaders = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const headers = rawHeaders.map((h, idx) => h ? h : `col_${idx}`);

            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const rawValues = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                headers.forEach((h, idx) => {
                    obj[h] = (idx < rawValues.length) ? rawValues[idx] : '';
                });
                rows.push(obj);
            }
            return { headers, rows };
        }

        // ----- Extract data starting from row 4 (index 3) -----
        function extractFromRow4(rows) {
            if (rows.length <= 3) return [];
            return rows.slice(3);
        }

        // ----- Check if Column A (index 0) has a valid value -----
        function hasValidColA(row) {
            let colAValue = '';
            if (headerNames[0] && row[headerNames[0]] !== undefined) {
                colAValue = row[headerNames[0]];
            } else {
                const values = Object.values(row);
                colAValue = values[0] || '';
            }
            return colAValue !== undefined && 
                   colAValue !== null && 
                   String(colAValue).trim() !== '';
        }

        // ----- Load data -----
        async function loadDataFromUrl(url) {
            if (!url || url.trim() === '') {
                showError('Please paste a valid data URL.');
                return;
            }
            const trimmedUrl = url.trim();
            currentSource = trimmedUrl;

            loadingEl.style.display = 'flex';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
            columnControls.style.display = 'none';
            hideError();
            allData = [];
            filteredData = [];
            headerNames = [];

            try {
                const response = await fetch(trimmedUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} — ${response.statusText}`);
                }
                const text = await response.text();
                const trimmedText = text.trim();

                const isCSV = trimmedText.includes(',') && 
                              (trimmedText.includes('\n') || trimmedText.includes('\r')) &&
                              !trimmedText.startsWith('{') && !trimmedText.startsWith('[');

                let rows = [];
                let headers = [];

                if (isCSV) {
                    const parsed = parseCSV(trimmedText);
                    headers = parsed.headers;
                    rows = parsed.rows;
                } else {
                    try {
                        const json = JSON.parse(trimmedText);
                        let arrayData = Array.isArray(json) ? json : 
                                        (json.data && Array.isArray(json.data) ? json.data : 
                                        (json.items && Array.isArray(json.items) ? json.items :
                                        (json.results && Array.isArray(json.results) ? json.results : [json])));
                        if (arrayData.length > 0) {
                            headers = Object.keys(arrayData[0]);
                            rows = arrayData;
                        } else {
                            rows = [];
                        }
                    } catch (e) {
                        if (trimmedText.includes(',') && trimmedText.includes('\n')) {
                            const parsed = parseCSV(trimmedText);
                            headers = parsed.headers;
                            rows = parsed.rows;
                        } else {
                            throw new Error('Data format not recognized. Please provide CSV or JSON.');
                        }
                    }
                }

                headerNames = headers;

                // Start from row 4 for CSV, or use all rows for JSON
                let dataRows = [];
                if (isCSV) {
                    dataRows = extractFromRow4(rows);
                } else {
                    dataRows = rows;
                }

                // Build allData: select columns A-L + R(17), S(18) AND filter by valid Col A
                allData = dataRows
                    .filter(row => hasValidColA(row))
                    .map(row => {
                        const newRow = {};
                        selectedIndices.forEach((idx, pos) => {
                            const key = (idx < headerNames.length) ? headerNames[idx] : `col_${idx}`;
                            if (headerNames[idx] && row[headerNames[idx]] !== undefined) {
                                newRow[`col_${pos}`] = row[headerNames[idx]];
                            } else {
                                const values = Object.values(row);
                                newRow[`col_${pos}`] = (idx < values.length) ? values[idx] : '';
                            }
                        });
                        return newRow;
                    });

                // Remove any rows that are completely empty
                allData = allData.filter(row => Object.values(row).some(v => v !== '' && v !== undefined && v !== null));

                filterInput.value = '';
                filteredData = allData.slice();
                
                // Build column controls and render
                buildColumnControls();
                renderTable();

            } catch (err) {
                console.error('Load error:', err);
                showError(err.message || 'Failed to fetch. Check URL or format.');
                loadingEl.style.display = 'none';
                table.style.display = 'none';
                emptyEl.style.display = 'none';
                columnControls.style.display = 'none';
            }
        }

        // ----- Build column visibility controls -----
        function buildColumnControls() {
            if (allData.length === 0) {
                columnControls.style.display = 'none';
                return;
            }

            // Determine which columns actually have data
            const sample = allData[0];
            availableKeys = Object.keys(sample);
            
            // Only show controls for columns that exist
            let hasVisibleColumns = false;
            let html = '';
            
            COLUMN_MAP.forEach((c, idx) => {
                const key = `col_${idx}`;
                if (availableKeys.includes(key)) {
                    hasVisibleColumns = true;
                    const isChecked = columnVisibility[key] !== false;
                    html += `
                        <label>
                            <input type="checkbox" class="col-toggle" data-col="${key}" ${isChecked ? 'checked' : ''} />
                            ${c.header}
                        </label>
                    `;
                }
            });

            if (hasVisibleColumns) {
                columnControls.style.display = 'flex';
                columnCheckboxes.innerHTML = html;
                
                // Add event listeners to individual checkboxes
                document.querySelectorAll('.col-toggle').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const colKey = this.dataset.col;
                        columnVisibility[colKey] = this.checked;
                        updateColumnVisibility();
                        updateToggleAllState();
                    });
                });

                // Toggle all
                toggleAllBtn.addEventListener('change', function() {
                    const isChecked = this.checked;
                    document.querySelectorAll('.col-toggle').forEach(cb => {
                        cb.checked = isChecked;
                        const colKey = cb.dataset.col;
                        columnVisibility[colKey] = isChecked;
                    });
                    updateColumnVisibility();
                });

                // Set initial toggle all state
                updateToggleAllState();
            } else {
                columnControls.style.display = 'none';
            }
        }

        // ----- Update column visibility in table -----
        function updateColumnVisibility() {
            // Get all header cells and data cells by column index
            const headers = thead.querySelectorAll('th');
            const rows = tbody.querySelectorAll('tr');
            
            COLUMN_MAP.forEach((c, idx) => {
                const key = `col_${idx}`;
                if (!availableKeys.includes(key)) return;
                
                const isVisible = columnVisibility[key] !== false;
                const colIndex = availableKeys.indexOf(key);
                
                if (colIndex === -1) return;
                
                // Update header
                if (headers[colIndex]) {
                    headers[colIndex].classList.toggle('col-hidden', !isVisible);
                }
                
                // Update all cells in this column
                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells[colIndex]) {
                        cells[colIndex].classList.toggle('col-hidden', !isVisible);
                    }
                });
            });
        }

        // ----- Update "Show All" checkbox state -----
        function updateToggleAllState() {
            const checkboxes = document.querySelectorAll('.col-toggle');
            if (checkboxes.length === 0) return;
            
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            toggleAllBtn.checked = allChecked;
        }

        // ----- Render table with custom headers -----
        function renderTable() {
            hideError();

            if (!filteredData || filteredData.length === 0) {
                table.style.display = 'none';
                emptyEl.style.display = 'block';
                loadingEl.style.display = 'none';
                columnControls.style.display = 'none';
                updateStats(0);
                return;
            }

            table.style.display = '';
            emptyEl.style.display = 'none';
            loadingEl.style.display = 'none';

            // Get available keys from first row
            const sample = filteredData[0];
            availableKeys = Object.keys(sample);

            // Build header row with custom headers
            const headerRow = document.createElement('tr');
            COLUMN_MAP.forEach((c, idx) => {
                const key = `col_${idx}`;
                if (availableKeys.includes(key)) {
                    const th = document.createElement('th');
                    th.textContent = c.header;
                    th.dataset.col = key;
                    if (columnVisibility[key] === false) {
                        th.classList.add('col-hidden');
                    }
                    headerRow.appendChild(th);
                }
            });
            thead.innerHTML = '';
            thead.appendChild(headerRow);

            // Build table body
            tbody.innerHTML = '';
            filteredData.forEach(item => {
                const row = document.createElement('tr');
                COLUMN_MAP.forEach((c, idx) => {
                    const key = `col_${idx}`;
                    if (availableKeys.includes(key)) {
                        const td = document.createElement('td');
                        let val = item[key];
                        if (val === null || val === undefined) val = '';
                        else if (typeof val === 'object') {
                            td.textContent = JSON.stringify(val).slice(0, 50) + (JSON.stringify(val).length > 50 ? '…' : '');
                        } else {
                            td.textContent = String(val);
                        }
                        if (columnVisibility[key] === false) {
                            td.classList.add('col-hidden');
                        }
                        row.appendChild(td);
                    }
                });
                tbody.appendChild(row);
            });

            updateStats(filteredData.length);
        }

        // ----- Filter -----
        function applyFilter() {
            const query = filterInput.value.trim().toLowerCase();
            if (!query) {
                filteredData = allData.slice();
            } else {
                filteredData = allData.filter(item => {
                    for (let key in item) {
                        const val = item[key];
                        if (val === null || val === undefined) continue;
                        if (String(val).toLowerCase().includes(query)) return true;
                    }
                    return false;
                });
            }
            renderTable();
            // Re-apply column visibility after filter
            setTimeout(updateColumnVisibility, 50);
        }

        // ----- Event listeners -----
        loadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const url = sourceInput.value.trim();
            if (url) loadDataFromUrl(url);
            else showError('Please paste a data URL first.');
        });

        reloadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let url = currentSource || sourceInput.value.trim();
            if (!url) {
                showError('No data source. Paste a URL and load first.');
                return;
            }
            sourceInput.value = url;
            loadDataFromUrl(url);
        });

        filterInput.addEventListener('input', applyFilter);

        sourceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loadBtn.click();
            }
        });

        // ----- Auto-load default -----
        const defaultUrl = sourceInput.value.trim();
        if (defaultUrl) {
            setTimeout(() => loadDataFromUrl(defaultUrl), 120);
        } else {
            loadingEl.style.display = 'none';
            emptyEl.style.display = 'block';
            updateStats(0);
        }

    })();
</script>
