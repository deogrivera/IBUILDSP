<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub-Project Financial Performance Dashboard</title>
  <!-- Tailwind CSS for Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- Chart.js for Data Visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Sub-Project Performance Dashboard</h1>
        <p class="text-sm text-gray-500">Real-time Obligation & Disbursement Monitoring</p>
      </div>
      <button id="refreshBtn" onclick="loadDashboardData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        Refresh Data
      </button>
    </header>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <span class="text-xs font-semibold uppercase text-gray-400">Total SP Profiles</span>
        <div id="kpi-profiles" class="text-2xl font-bold text-gray-800 mt-1">--</div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <span class="text-xs font-semibold uppercase text-gray-400">Total Obligations (LP + GOP)</span>
        <div id="kpi-obligations" class="text-2xl font-bold text-blue-600 mt-1">--</div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <span class="text-xs font-semibold uppercase text-gray-400">Total Disbursements (LP + GOP)</span>
        <div id="kpi-disbursements" class="text-2xl font-bold text-emerald-600 mt-1">--</div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <span class="text-xs font-semibold uppercase text-gray-400">Financial Execution Rate</span>
        <div id="kpi-rate" class="text-2xl font-bold text-purple-600 mt-1">--</div>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Obligations vs. Disbursements (LP vs. GOP)</h2>
        <canvas id="fundingChart" class="w-full h-64"></canvas>
      </div>
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Disbursement Progress</h2>
        <canvas id="progressChart" class="w-full h-64"></canvas>
      </div>
    </div>

  </div>

  <script>
    const CSV_URLS = {
      spProfile: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhSBfaw-U9YH1Kq1n7NvZ-gqFYn1OVz3326ZsT5f3ZazvfINlb0Ln8DC_G07_oleBkRS4EIxySYWhy/pub?gid=744116802&single=true&output=csv",
      obligLP: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhSBfaw-U9YH1Kq1n7NvZ-gqFYn1OVz3326ZsT5f3ZazvfINlb0Ln8DC_G07_oleBkRS4EIxySYWhy/pub?gid=708721244&single=true&output=csv",
      obligGOP: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhSBfaw-U9YH1Kq1n7NvZ-gqFYn1OVz3326ZsT5f3ZazvfINlb0Ln8DC_G07_oleBkRS4EIxySYWhy/pub?gid=880364128&single=true&output=csv",
      disbLP: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhSBfaw-U9YH1Kq1n7NvZ-gqFYn1OVz3326ZsT5f3ZazvfINlb0Ln8DC_G07_oleBkRS4EIxySYWhy/pub?gid=782775444&single=true&output=csv",
      disbGOP: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhSBfaw-U9YH1Kq1n7NvZ-gqFYn1OVz3326ZsT5f3ZazvfINlb0Ln8DC_G07_oleBkRS4EIxySYWhy/pub?gid=1254496839&single=true&output=csv"
    };

    function fetchCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          dynamicTyping: true,
          complete: (results) => resolve(results.data),
          error: (err) => reject(err)
        });
      });
    }

    async function loadDashboardData() {
      try {
        const [spProfile, obligLP, obligGOP, disbLP, disbGOP] = await Promise.all([
          fetchCSV(CSV_URLS.spProfile),
          fetchCSV(CSV_URLS.obligLP),
          fetchCSV(CSV_URLS.obligGOP),
          fetchCSV(CSV_URLS.disbLP),
          fetchCSV(CSV_URLS.disbGOP)
        ]);

        // KPI Updates
        document.getElementById("kpi-profiles").innerText = spProfile.length;
        
        // Example totals aggregation (adjust field names based on actual header names in sheets)
        console.log("SP Profiles:", spProfile);
        console.log("Obligations LP:", obligLP);
        
        // Render or Update Charts here
      } catch (error) {
        console.error("Error loading CSV files:", error);
      }
    }

    // Initial Load
    loadDashboardData();
  </script>
</body>
</html>
