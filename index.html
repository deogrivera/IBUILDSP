<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data loader · paste your source</title>
    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.25);
            padding: 2rem 2rem 2.5rem;
            transition: 0.2s;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #0b1e2b;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 0.4rem;
        }

        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 0.75rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 1.2rem;
        }

        .source-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            background: #f2f6fc;
            padding: 0.5rem 1rem 0.5rem 1.4rem;
            border-radius: 60px;
            border: 1px solid #d5dee7;
            flex: 1 1 280px;
        }

        .source-area i {
            color: #2d7aff;
            font-size: 1rem;
        }

        .source-area input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
            outline: none;
            color: #0b1e2b;
            font-weight: 450;
        }

        .source-area input::placeholder {
            color: #8ba0b3;
            font-weight: 350;
        }

        .source-area input:focus {
            border-bottom: 2px solid #2d7aff;
            padding-bottom: 0.3rem;
        }

        .load-btn {
            background: #2d7aff;
            border: none;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            border: 1px solid #2d7aff;
        }

        .load-btn:hover {
            background: #1a5fd9;
            border-color: #1a5fd9;
            box-shadow: 0 4px 10px rgba(45, 122, 255, 0.25);
        }

        .load-btn:active {
            transform: scale(0.96);
        }

        .stats {
            background: #eef3f8;
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1f3a4b;
            font-weight: 500;
            white-space: nowrap;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1d3b4f;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-group input {
            padding: 0.5rem 1rem;
            border: 1.5px solid #dbe1e9;
            border-radius: 60px;
            font-size: 0.9rem;
            background: white;
            min-width: 200px;
            transition: 0.2s;
            outline: none;
        }

        .filter-group input:focus {
            border-color: #2d7aff;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.15);
        }

        .filter-group input::placeholder {
            color: #9aabb8;
            font-weight: 300;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e6ecf3;
            background: white;
            margin-top: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 480px;
        }

        th {
            text-align: left;
            padding: 1rem 1.2rem;
            background: #f8fafc;
            color: #1d3b4f;
            font-weight: 600;
            border-bottom: 2px solid #dde4ed;
            white-space: nowrap;
        }

        td {
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid #eaeef4;
            color: #1e2f3e;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f6f9ff;
        }

        .empty-state {
            padding: 3.5rem 1rem;
            text-align: center;
            color: #5f7485;
            font-size: 1rem;
            background: #fafcfe;
        }

        .empty-state i {
            font-size: 2.2rem;
            color: #b6c9db;
            margin-bottom: 0.5rem;
            display: block;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 3rem 0;
            color: #2a4a62;
        }

        .loading i {
            font-size: 1.8rem;
            color: #2d7aff;
        }

        .error-box {
            background: #fff5f5;
            border: 1px solid #ffc9c9;
            border-radius: 60px;
            padding: 0.8rem 1.6rem;
            color: #b33c3c;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        /* responsive */
        @media (max-width: 700px) {
            .card { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { flex-direction: column; align-items: stretch; }
            .filter-group input { min-width: unset; width: 100%; }
            .stats { align-self: flex-start; }
            .source-area { border-radius: 30px; padding: 0.5rem 1rem; }
            .load-btn { width: 100%; justify-content: center; }
        }

        .badge-id {
            background: #e6edf6;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1e3f5a;
            display: inline-block;
        }

        .inline-flex {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <header>
        <h1>
            <i class="fas fa-database" style="color: #2d7aff; font-size: 1.8rem;"></i>
            Data Viewer
        </h1>
        <div class="subhead">
            <div class="source-area">
                <i class="fas fa-paste"></i>
                <input type="text" id="sourceInput" placeholder="Paste your data URL or JSON endpoint..." value="https://jsonplaceholder.typicode.com/posts">
                <button class="load-btn" id="loadBtn"><i class="fas fa-arrow-right"></i> Load</button>
            </div>
            <span class="stats" id="statsDisplay"><i class="far fa-file-alt"></i> 0 records</span>
        </div>
    </header>

    <div class="toolbar">
        <div class="filter-group">
            <label for="filterInput"><i class="fas fa-search" style="color: #5b7a93;"></i> Filter</label>
            <input type="text" id="filterInput" placeholder="Search any field...">
        </div>
        <button id="reloadBtn" style="background: white; border: 1.5px solid #dbe1e9; padding: 0.5rem 1.2rem; border-radius: 60px; font-weight: 500; color: #1d3b4f; cursor: pointer; transition: 0.15s; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-sync-alt"></i> Reload
        </button>
    </div>

    <!-- Table container -->
    <div class="table-wrapper" id="tableWrapper">
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner fa-pulse"></i> Loading data…
        </div>
        <table id="dataTable" style="display: none;">
            <thead id="tableHead">
                <!-- dynamic headers -->
            </thead>
            <tbody id="tableBody">
                <!-- rows -->
            </tbody>
        </table>
        <div id="emptyMessage" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i>
            No records found
        </div>
    </div>

    <!-- error inline -->
    <div id="errorMessage" class="error-box" style="display: none; margin-top: 1.2rem;">
        <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM elements
        const sourceInput = document.getElementById('sourceInput');
        const loadBtn = document.getElementById('loadBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const filterInput = document.getElementById('filterInput');

        const table = document.getElementById('dataTable');
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        const loadingEl = document.getElementById('loadingIndicator');
        const emptyEl = document.getElementById('emptyMessage');
        const errorEl = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const statsDisplay = document.getElementById('statsDisplay');

        // state
        let allData = [];
        let filteredData = [];
        let headers = [];
        let currentSource = '';   // store last loaded url

        // ---------- helpers ----------
        function showError(msg) {
            errorText.textContent = msg || 'Could not load data.';
            errorEl.style.display = 'flex';
            loadingEl.style.display = 'none';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        function updateStats(count) {
            statsDisplay.innerHTML = `<i class="far fa-file-alt"></i> ${count} record${count !== 1 ? 's' : ''}`;
        }

        // render table from filteredData
        function renderTable() {
            hideError();

            if (!filteredData || filteredData.length === 0) {
                table.style.display = 'none';
                emptyEl.style.display = 'block';
                loadingEl.style.display = 'none';
                updateStats(0);
                return;
            }

            table.style.display = '';
            emptyEl.style.display = 'none';
            loadingEl.style.display = 'none';

            if (headers.length === 0 && filteredData.length > 0) {
                headers = Object.keys(filteredData[0]);
            }

            thead.innerHTML = '';
            const headerRow = document.createElement('tr');
            headers.forEach(key => {
                const th = document.createElement('th');
                th.textContent = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            tbody.innerHTML = '';
            filteredData.forEach(item => {
                const row = document.createElement('tr');
                headers.forEach(key => {
                    const td = document.createElement('td');
                    const val = item[key];
                    if (val === null || val === undefined) {
                        td.textContent = '';
                    } else if (typeof val === 'object') {
                        td.textContent = JSON.stringify(val).slice(0, 60) + (JSON.stringify(val).length > 60 ? '…' : '');
                    } else {
                        td.textContent = String(val);
                    }
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });

            updateStats(filteredData.length);
        }

        // filter data based on input (any field)
        function applyFilter() {
            const query = filterInput.value.trim().toLowerCase();
            if (!query) {
                filteredData = allData.slice();
            } else {
                filteredData = allData.filter(item => {
                    for (let key in item) {
                        const val = item[key];
                        if (val === null || val === undefined) continue;
                        const strVal = String(val).toLowerCase();
                        if (strVal.includes(query)) return true;
                    }
                    return false;
                });
            }
            renderTable();
        }

        // core load function: accepts a URL string
        async function loadDataFromUrl(url) {
            if (!url || url.trim() === '') {
                showError('Please paste a valid data URL.');
                return;
            }

            const trimmedUrl = url.trim();
            currentSource = trimmedUrl;

            // reset UI
            loadingEl.style.display = 'flex';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
            hideError();
            filteredData = [];
            allData = [];
            headers = [];

            try {
                const response = await fetch(trimmedUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} — ${response.statusText}`);
                }
                const data = await response.json();

                let arrayData = data;
                if (!Array.isArray(data)) {
                    // try to extract array from common wrappers
                    if (data.data && Array.isArray(data.data)) arrayData = data.data;
                    else if (data.items && Array.isArray(data.items)) arrayData = data.items;
                    else if (data.results && Array.isArray(data.results)) arrayData = data.results;
                    else {
                        // single object → wrap
                        arrayData = [data];
                    }
                }

                if (arrayData.length === 0) {
                    allData = [];
                    filteredData = [];
                    renderTable();
                    loadingEl.style.display = 'none';
                    return;
                }

                allData = arrayData;
                filterInput.value = '';
                filteredData = allData.slice();
                if (allData.length > 0) {
                    headers = Object.keys(allData[0]);
                } else {
                    headers = [];
                }
                renderTable();

            } catch (err) {
                console.error('Data loading error:', err);
                showError(err.message || 'Failed to fetch. Check URL or CORS.');
                loadingEl.style.display = 'none';
                table.style.display = 'none';
                emptyEl.style.display = 'none';
            }
        }

        // ---------- event listeners ----------
        // Load button: take value from input
        loadBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const url = sourceInput.value.trim();
            if (url) {
                loadDataFromUrl(url);
            } else {
                showError('Please paste a data URL first.');
            }
        });

        // Reload button: reuse current source (or input value if empty)
        reloadBtn.addEventListener('click', function(e) {
            e.preventDefault();
            let url = currentSource;
            // if currentSource is empty, fallback to input value
            if (!url) {
                url = sourceInput.value.trim();
                if (!url) {
                    showError('No data source to reload. Paste a URL and load first.');
                    return;
                }
            }
            // update input field to reflect current source
            sourceInput.value = url;
            loadDataFromUrl(url);
        });

        // Filter input
        filterInput.addEventListener('input', applyFilter);

        // optional: press Enter in sourceInput triggers load
        sourceInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loadBtn.click();
            }
        });

        // ---------- initial load with default value ----------
        // Pre-fill with a sample, but we want to load it automatically.
        const defaultUrl = sourceInput.value.trim();
        if (defaultUrl) {
            // small delay to let DOM settle, then load
            setTimeout(() => {
                loadDataFromUrl(defaultUrl);
            }, 80);
        } else {
            // if empty, show empty state
            loadingEl.style.display = 'none';
            emptyEl.style.display = 'block';
            updateStats(0);
        }

        // expose to console for debugging (optional)
        window.__debug = { loadDataFromUrl, allData, filteredData };

    })();
</script>

<!-- 
  *************** HOW TO USE ***************
  1. The textbox is now EDITABLE. Paste your data URL (JSON endpoint or local file).
  2. Click "Load" or press Enter to fetch and display data.
  3. Use the filter to search across all fields.
  4. "Reload" fetches the same URL again (useful for dynamic data).
  5. Works with arrays of objects. Nested objects are displayed as JSON strings.
-->

</body>
</html>
