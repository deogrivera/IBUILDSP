<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Viewer · CSV & JSON support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* (same styles as before - keep them) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f7fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .card { max-width: 1200px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 40px -12px rgba(0,20,30,0.25); padding: 2rem; }
        h1 { font-size: 1.9rem; font-weight: 600; color: #0b1e2b; display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem; }
        .subhead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.8rem; border-bottom: 1px solid #e9edf2; padding-bottom: 1.2rem; }
        .source-area { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; background: #f2f6fc; padding: 0.5rem 1rem 0.5rem 1.4rem; border-radius: 60px; border: 1px solid #d5dee7; flex: 1 1 280px; }
        .source-area i { color: #2d7aff; }
        .source-area input { border: none; background: transparent; padding: 0.5rem 0; font-size: 0.9rem; flex: 1; min-width: 140px; outline: none; color: #0b1e2b; }
        .source-area input::placeholder { color: #8ba0b3; }
        .load-btn { background: #2d7aff; border: none; color: white; font-weight: 500; padding: 0.5rem 1.5rem; border-radius: 60px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #2d7aff; }
        .load-btn:hover { background: #1a5fd9; }
        .stats { background: #eef3f8; padding: 0.35rem 1.2rem; border-radius: 40px; font-size: 0.9rem; color: #1f3a4b; font-weight: 500; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
        .filter-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .filter-group input { padding: 0.5rem 1rem; border: 1.5px solid #dbe1e9; border-radius: 60px; font-size: 0.9rem; background: white; min-width: 200px; outline: none; }
        .filter-group input:focus { border-color: #2d7aff; box-shadow: 0 0 0 3px rgba(45,122,255,0.15); }
        .table-wrapper { overflow-x: auto; border-radius: 20px; border: 1px solid #e6ecf3; background: white; margin-top: 0.5rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; min-width: 480px; }
        th { text-align: left; padding: 1rem 1.2rem; background: #f8fafc; color: #1d3b4f; font-weight: 600; border-bottom: 2px solid #dde4ed; }
        td { padding: 0.9rem 1.2rem; border-bottom: 1px solid #eaeef4; color: #1e2f3e; }
        tr:hover td { background: #f6f9ff; }
        .empty-state { padding: 3.5rem 1rem; text-align: center; color: #5f7485; background: #fafcfe; }
        .empty-state i { font-size: 2.2rem; color: #b6c9db; display: block; margin-bottom: 0.5rem; }
        .loading { display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: 3rem 0; color: #2a4a62; }
        .loading i { font-size: 1.8rem; color: #2d7aff; }
        .error-box { background: #fff5f5; border: 1px solid #ffc9c9; border-radius: 60px; padding: 0.8rem 1.6rem; color: #b33c3c; display: inline-flex; align-items: center; gap: 10px; font-weight: 500; margin-top: 1.2rem; }
        #reloadBtn { background: white; border: 1.5px solid #dbe1e9; padding: 0.5rem 1.2rem; border-radius: 60px; font-weight: 500; color: #1d3b4f; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        @media (max-width: 700px) { .card { padding: 1.5rem; } .toolbar { flex-direction: column; align-items: stretch; } .filter-group { flex-direction: column; align-items: stretch; } .filter-group input { min-width: unset; width: 100%; } .source-area { border-radius: 30px; } .load-btn { width: 100%; justify-content: center; } }
    </style>
</head>
<body>

<div class="card">
    <header>
        <h1><i class="fas fa-database" style="color: #2d7aff;"></i> Data Viewer</h1>
        <div class="subhead">
            <div class="source-area">
                <i class="fas fa-paste"></i>
                <input type="text" id="sourceInput" placeholder="Paste URL (CSV or JSON)..." value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSKiPjvkcJeCP7VuAjjFsIvMskQUlF_FegjMFxaxv6Hg-tCKLNCjPWIo1jb_G3-TgRuEXs0BK6TxOq3/pub?gid=1826747769&single=true&output=csv">
                <button class="load-btn" id="loadBtn"><i class="fas fa-arrow-right"></i> Load</button>
            </div>
            <span class="stats" id="statsDisplay"><i class="far fa-file-alt"></i> 0 records</span>
        </div>
    </header>

    <div class="toolbar">
        <div class="filter-group">
            <label for="filterInput"><i class="fas fa-search"></i> Filter</label>
            <input type="text" id="filterInput" placeholder="Search any field...">
        </div>
        <button id="reloadBtn"><i class="fas fa-sync-alt"></i> Reload</button>
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner fa-pulse"></i> Loading data…
        </div>
        <table id="dataTable" style="display: none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyMessage" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i> No records found
        </div>
    </div>

    <div id="errorMessage" class="error-box" style="display: none;">
        <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
    </div>
</div>

<script>
(function() {
    const sourceInput = document.getElementById('sourceInput');
    const loadBtn = document.getElementById('loadBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const filterInput = document.getElementById('filterInput');
    const table = document.getElementById('dataTable');
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');
    const loadingEl = document.getElementById('loadingIndicator');
    const emptyEl = document.getElementById('emptyMessage');
    const errorEl = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const statsDisplay = document.getElementById('statsDisplay');

    let allData = [];
    let filteredData = [];
    let headers = [];
    let currentSource = '';

    function showError(msg) {
        errorText.textContent = msg || 'Could not load data.';
        errorEl.style.display = 'flex';
        loadingEl.style.display = 'none';
        table.style.display = 'none';
        emptyEl.style.display = 'none';
    }

    function hideError() { errorEl.style.display = 'none'; }

    function updateStats(count) {
        statsDisplay.innerHTML = `<i class="far fa-file-alt"></i> ${count} record${count !== 1 ? 's' : ''}`;
    }

    // Parse CSV to array of objects
    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return [];

        // Parse headers (handle quoted values)
        const headerLine = lines[0];
        const headers = headerLine.split(',').map(h => h.trim().replace(/^"|"$/g, ''));

        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, idx) => {
                obj[h] = values[idx] || '';
            });
            result.push(obj);
        }
        return result;
    }

    async function loadDataFromUrl(url) {
        if (!url || url.trim() === '') {
            showError('Please paste a valid data URL.');
            return;
        }

        const trimmedUrl = url.trim();
        currentSource = trimmedUrl;

        loadingEl.style.display = 'flex';
        table.style.display = 'none';
        emptyEl.style.display = 'none';
        hideError();
        filteredData = [];
        allData = [];
        headers = [];

        try {
            const response = await fetch(trimmedUrl);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} — ${response.statusText}`);
            }

            const text = await response.text();
            let arrayData = [];

            // Try to detect if it's CSV (starts with header-like text or contains commas)
            const trimmedText = text.trim();
            const isCSV = trimmedText.includes(',') && 
                          (trimmedText.includes('\n') || trimmedText.includes('\r')) &&
                          !trimmedText.startsWith('{') && !trimmedText.startsWith('[');

            if (isCSV) {
                // Parse as CSV
                arrayData = parseCSV(trimmedText);
            } else {
                // Try to parse as JSON
                try {
                    const jsonData = JSON.parse(trimmedText);
                    if (Array.isArray(jsonData)) {
                        arrayData = jsonData;
                    } else if (jsonData.data && Array.isArray(jsonData.data)) {
                        arrayData = jsonData.data;
                    } else if (jsonData.items && Array.isArray(jsonData.items)) {
                        arrayData = jsonData.items;
                    } else if (jsonData.results && Array.isArray(jsonData.results)) {
                        arrayData = jsonData.results;
                    } else {
                        arrayData = [jsonData];
                    }
                } catch (jsonErr) {
                    // If JSON parsing fails, try CSV as fallback
                    if (trimmedText.includes(',') && trimmedText.includes('\n')) {
                        arrayData = parseCSV(trimmedText);
                    } else {
                        throw new Error('Data format not recognized. Please provide CSV or JSON.');
                    }
                }
            }

            if (arrayData.length === 0) {
                allData = [];
                filteredData = [];
                renderTable();
                loadingEl.style.display = 'none';
                return;
            }

            allData = arrayData;
            filterInput.value = '';
            filteredData = allData.slice();
            if (allData.length > 0) {
                headers = Object.keys(allData[0]);
            }
            renderTable();

        } catch (err) {
            console.error('Data loading error:', err);
            showError(err.message || 'Failed to fetch. Check URL or format.');
            loadingEl.style.display = 'none';
            table.style.display = 'none';
            emptyEl.style.display = 'none';
        }
    }

    function renderTable() {
        hideError();

        if (!filteredData || filteredData.length === 0) {
            table.style.display = 'none';
            emptyEl.style.display = 'block';
            loadingEl.style.display = 'none';
            updateStats(0);
            return;
        }

        table.style.display = '';
        emptyEl.style.display = 'none';
        loadingEl.style.display = 'none';

        if (headers.length === 0 && filteredData.length > 0) {
            headers = Object.keys(filteredData[0]);
        }

        thead.innerHTML = '';
        const headerRow = document.createElement('tr');
        headers.forEach(key => {
            const th = document.createElement('th');
            th.textContent = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        tbody.innerHTML = '';
        filteredData.forEach(item => {
            const row = document.createElement('tr');
            headers.forEach(key => {
                const td = document.createElement('td');
                const val = item[key];
                if (val === null || val === undefined) {
                    td.textContent = '';
                } else if (typeof val === 'object') {
                    td.textContent = JSON.stringify(val).slice(0, 60) + (JSON.stringify(val).length > 60 ? '…' : '');
                } else {
                    td.textContent = String(val);
                }
                row.appendChild(td);
            });
            tbody.appendChild(row);
        });

        updateStats(filteredData.length);
    }

    function applyFilter() {
        const query = filterInput.value.trim().toLowerCase();
        if (!query) {
            filteredData = allData.slice();
        } else {
            filteredData = allData.filter(item => {
                for (let key in item) {
                    const val = item[key];
                    if (val === null || val === undefined) continue;
                    if (String(val).toLowerCase().includes(query)) return true;
                }
                return false;
            });
        }
        renderTable();
    }

    loadBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const url = sourceInput.value.trim();
        if (url) loadDataFromUrl(url);
        else showError('Please paste a data URL first.');
    });

    reloadBtn.addEventListener('click', function(e) {
        e.preventDefault();
        let url = currentSource || sourceInput.value.trim();
        if (!url) {
            showError('No data source. Paste a URL and load first.');
            return;
        }
        sourceInput.value = url;
        loadDataFromUrl(url);
    });

    filterInput.addEventListener('input', applyFilter);

    sourceInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            loadBtn.click();
        }
    });

    // Auto-load the default URL
    const defaultUrl = sourceInput.value.trim();
    if (defaultUrl) {
        setTimeout(() => loadDataFromUrl(defaultUrl), 100);
    } else {
        loadingEl.style.display = 'none';
        emptyEl.style.display = 'block';
        updateStats(0);
    }
})();
</script>

</body>
</html>
